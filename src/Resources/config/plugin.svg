<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Brand mark: a single "0" as the recognition sign, emerald on a neutral anthracite square.
       Works as favicon and app icon, stays legible on light/dark backgrounds. -->
  <rect width="64" height="64" rx="12" fill="#0B0F14"/>
  <text x="32" y="48" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif"
        font-weight="800" font-size="48" letter-spacing="-0.04em"
        fill="#10b981">0</text>
</svg>
